name: Create signing key (run once)

on:
  workflow_dispatch:

jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Generate upload keystore
        run: |
          PASS=$(openssl rand -hex 12)
          keytool -genkeypair -v -keystore release.jks -storetype PKCS12 \
            -alias chat4chat -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PASS" -keypass "$PASS" \
            -dname "CN=Chat4Chat, O=Chat4Chat, C=GB" > /dev/null
          {
            echo "KEYSTORE_PASSWORD=$PASS"
            echo "KEY_ALIAS=chat4chat"
            echo "KEY_PASSWORD=$PASS"
            echo ""
            echo "KEYSTORE_BASE64="
            base64 -w 0 release.jks
            echo ""
          } > keystore-secrets.txt

      - name: Upload (download it from the run page, then delete the artifact)
        uses: actions/upload-artifact@v4
        with:
          name: KEEP-SAFE-signing-key
          path: |
            release.jks
            keystore-secrets.txt
          retention-days: 1
