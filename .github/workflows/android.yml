name: Build Android app

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  # Folder that contains settings.gradle.kts. Use "." if the project is at the top of your repo,
  # or "Chat4Chat" if you uploaded it inside a folder.
  PROJECT_DIR: .

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
          build-root-directory: ${{ env.PROJECT_DIR }}

      - name: Add Firebase config
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::Missing secret GOOGLE_SERVICES_JSON (paste the whole google-services.json file)."
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json

      - name: Add GIPHY key
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          GIPHY_KEY: ${{ secrets.GIPHY_API_KEY }}
        run: |
          if [ -n "$GIPHY_KEY" ]; then
            sed -i "s/PASTE_YOUR_GIPHY_API_KEY/$GIPHY_KEY/" app/src/main/java/com/chat4chat/app/Data.kt
          else
            echo "::warning::No GIPHY_API_KEY secret, so GIF search will not work."
          fi

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No KEYSTORE_BASE64 secret, so the release bundle will be unsigned (Google Play will not accept it)."
          fi

      - name: Build debug APK and release bundle
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: gradle :app:assembleDebug :app:bundleRelease --no-daemon --stacktrace

      - name: Upload debug APK (install on a phone to test)
        uses: actions/upload-artifact@v4
        with:
          name: Chat4Chat-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk

      - name: Upload release bundle (upload this to Google Play)
        uses: actions/upload-artifact@v4
        with:
          name: Chat4Chat-release-aab
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/bundle/release/*.aab
